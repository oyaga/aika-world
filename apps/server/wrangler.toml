# Um único Worker serve o site (apps/web/dist) e o multiplayer (/world) no mesmo endereço.
# Deploy: `pnpm release` na raiz (gera o site e publica), ou o workflow .github/workflows/deploy.yml.
name = "aika-world"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Domínio próprio (zona já na Cloudflare). O workers.dev fica desligado.
workers_dev = false
routes = [
  { pattern = "aikanakamura.com", custom_domain = true },
  { pattern = "www.aikanakamura.com", custom_domain = true },
]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Estas rotas vão direto para o código do Worker (o resto é arquivo estático).
run_worker_first = ["/world", "/health"]

[[durable_objects.bindings]]
name = "WORLD"
class_name = "World"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["World"]

# [vars]
# Restringe quem pode abrir o WebSocket (útil se o site também ficar em outro domínio):
# ALLOWED_ORIGINS = "https://aikaworld.com"
